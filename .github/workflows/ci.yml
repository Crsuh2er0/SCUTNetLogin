name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Build & run packet unit tests (MSVC + Qt)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Qt 6.8 LTS 工具链（msvc2022_64）。测试覆盖的协议纯函数与
      # Qt 版本无关；主程序需 Npcap SDK（本地构建），CI 只跑测试。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure & Build & Run tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd tests
          qmake tst_packets.pro
          if errorlevel 1 exit /b 1
          nmake release
          if errorlevel 1 exit /b 1
          release\tst_packets.exe
